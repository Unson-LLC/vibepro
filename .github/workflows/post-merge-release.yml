name: Post-merge continuous release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: post-merge-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validation:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, Linux, X64, wsl-linux, nucbox-evo-x2]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      release_required: ${{ steps.projection.outputs.release_required || steps.dispatch_projection.outputs.release_required }}
      version: ${{ steps.projection.outputs.version || steps.dispatch_projection.outputs.version }}
      validation_mode: ${{ steps.validation.outputs.validation_mode }}
      validation_reason: ${{ steps.validation.outputs.validation_reason }}
      merged: ${{ steps.pull_request.outputs.merged }}
      pr_number: ${{ steps.pull_request.outputs.pr_number }}
      merge_sha: ${{ steps.pull_request.outputs.merge_sha }}
      base_sha: ${{ steps.pull_request.outputs.base_sha }}
      head_sha: ${{ steps.pull_request.outputs.head_sha }}
      merged_at: ${{ steps.pull_request.outputs.merged_at }}
    steps:
      - name: Resolve merged pull request for the pushed commit
        id: pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          # push: the pushed merge commit. workflow_dispatch: the current tip of
          # main at run time, never a stale or PR-supplied SHA.
          MERGE_SHA: ${{ github.sha }}
        run: |
          PR_NUMBER=""
          for attempt in 1 2 3; do
            PR_NUMBER=$(gh api "repos/$GITHUB_REPOSITORY/commits/$MERGE_SHA/pulls" --jq "map(select(.merged_at != null and .merge_commit_sha == \"$MERGE_SHA\" and .base.ref == \"main\")) | .[0].number // empty")
            if [ -n "$PR_NUMBER" ] || [ "$attempt" = 3 ]; then break; fi
            # commits/{sha}/pulls can lag right after a merge.
            sleep "${PR_LOOKUP_RETRY_DELAY:-10}"
          done
          if [ -z "$PR_NUMBER" ] && [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # A dispatch still releases MERGE_SHA; only its release notes come from the latest merged PR before it.
            for COMMIT in $(gh api "repos/$GITHUB_REPOSITORY/commits?sha=$MERGE_SHA&per_page=30" --jq '.[1:][].sha'); do
              PR_NUMBER=$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT/pulls" --jq "map(select(.merged_at != null and .merge_commit_sha == \"$COMMIT\" and .base.ref == \"main\")) | .[0].number // empty")
              if [ -n "$PR_NUMBER" ]; then break; fi
            done
          fi
          if [ -z "$PR_NUMBER" ]; then
            echo "::warning::No merged main pull request found for ${MERGE_SHA} after 3 lookups; package release and docs are skipped."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "pull_request=none (no merged main PR for ${MERGE_SHA})" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '{action: "closed", number: .number, pull_request: .}' > "$RUNNER_TEMP/post-merge-release-event.json"
          {
            echo "merged=true"
            echo "pr_number=$PR_NUMBER"
            echo "merge_sha=$MERGE_SHA"
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '"base_sha=\(.base.sha)\nhead_sha=\(.head.sha)\nmerged_at=\(.merged_at)"'
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: ${{ steps.pull_request.outputs.merged == 'true' }}
        with:
          # The selector is code from the immutable pre-merge base, never from
          # the pull request or the moving post-merge default branch.
          ref: ${{ steps.pull_request.outputs.base_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        if: ${{ steps.pull_request.outputs.merged == 'true' }}
        with:
          node-version: 22
      - run: npm ci
        if: ${{ steps.pull_request.outputs.merged == 'true' }}
      - name: Plan conditional package release
        id: projection
        if: ${{ steps.pull_request.outputs.merged == 'true' && github.event_name == 'push' }}
        run: node scripts/post-merge-release.mjs plan --event "$RUNNER_TEMP/post-merge-release-event.json"
      - name: Plan dispatched release of the main tip
        id: dispatch_projection
        if: ${{ steps.pull_request.outputs.merged == 'true' && github.event_name == 'workflow_dispatch' }}
        env:
          MERGE_SHA: ${{ steps.pull_request.outputs.merge_sha }}
        run: |
          echo "release_required=true" >> "$GITHUB_OUTPUT"
          echo "version=$(git show "$MERGE_SHA:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')" >> "$GITHUB_OUTPUT"
          echo "dispatch_release_sha=${MERGE_SHA}" >> "$GITHUB_STEP_SUMMARY"
      - name: Select exact-SHA validation path
        id: validation
        if: ${{ steps.projection.outputs.release_required == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! node scripts/post-merge-release.mjs validation-plan --event "$RUNNER_TEMP/post-merge-release-event.json" --repository "$GITHUB_REPOSITORY"; then
            echo "validation_mode=full" >> "$GITHUB_OUTPUT"
            echo "validation_reason=trusted_base_selector_unavailable" >> "$GITHUB_OUTPUT"
            echo "reviewed_head_sha=${{ steps.pull_request.outputs.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "merge_sha=${{ steps.pull_request.outputs.merge_sha }}" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT" >> "$GITHUB_STEP_SUMMARY"

  # Validation stays on the self-hosted runner; only publication moves to a
  # GitHub-hosted runner because npm Trusted Publishing requires one.
  release-candidate:
    needs: validation
    if: ${{ needs.validation.outputs.release_required == 'true' }}
    runs-on: [self-hosted, Linux, X64, wsl-linux, nucbox-evo-x2]
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validation.outputs.merge_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Bind package release to the merged PR commit
        env:
          RELEASE_SHA: ${{ needs.validation.outputs.merge_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(node -p "require('./package.json').version")" = "${{ needs.validation.outputs.version }}"
          echo "release_target=${RELEASE_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "validation_mode=${{ needs.validation.outputs.validation_mode || 'full' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "validation_reason=${{ needs.validation.outputs.validation_reason || 'missing_validation_output' }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate release candidate
        run: |
          npm ci
          npm run typecheck
          node --test test/post-merge-release.test.js test/github-release-convergence.test.js test/e2e/story-vibepro-pr-driven-continuous-release-main.test.js test/e2e/story-vibepro-release-exact-sha-fast-path.test.js
          npm run pack:dry-run
      - name: Run full validation fallback
        if: ${{ needs.validation.outputs.validation_mode != 'fast' }}
        run: npm test

  release:
    needs: [validation, release-candidate]
    if: ${{ needs.validation.outputs.release_required == 'true' }}
    # npm Trusted Publishing accepts OIDC only from GitHub-hosted runners.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: read
      # npm Trusted Publishing exchanges the GitHub Actions OIDC token for a
      # short-lived publish token; npm also signs provenance with it.
      id-token: write
    outputs:
      publish_started_at: ${{ steps.publish.outputs.publish_started_at }}
      npm_published_at: ${{ steps.publish.outputs.npm_published_at }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validation.outputs.merge_sha }}
          fetch-depth: 0
      # Without a registry URL, setup-node writes no token-reading .npmrc, so a
      # failed OIDC exchange fails as ENEEDAUTH instead of falling back to a
      # stale token that fails as E404 on PUT.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Trusted Publishing needs npm >= 11.5.1; dist-tag add through OIDC
      # needs npm >= 11.21.0.
      - name: Install trusted-publishing npm CLI
        run: npm install --global npm@11.21.1
      - name: Bind publication to the validated merge commit
        env:
          RELEASE_SHA: ${{ needs.validation.outputs.merge_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(node -p "require('./package.json').version")" = "${{ needs.validation.outputs.version }}"
          npm ci
      - name: Resolve merged pull request event
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.validation.outputs.pr_number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '{action: "closed", number: .number, pull_request: .}' > "$RUNNER_TEMP/post-merge-release-event.json"
      # Authenticates only through npm Trusted Publishing (GitHub Actions OIDC);
      # no long-lived npm token is available to this job. npm logs why an OIDC
      # exchange was refused only at verbose level, so keep it on here.
      - name: Publish npm and reconcile GitHub Release under package lease
        id: publish
        env:
          NPM_CONFIG_LOGLEVEL: verbose
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validation.outputs.version }}
          RELEASE_SHA: ${{ needs.validation.outputs.merge_sha }}
        run: |
          PUBLISH_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "publish_started_at=${PUBLISH_STARTED_AT}" >> "$GITHUB_OUTPUT"
          RELEASE_LOCK=$(node scripts/npm-release-lock.mjs acquire)
          release_lock() { node scripts/npm-release-lock.mjs release "$RELEASE_LOCK"; }
          trap release_lock EXIT
          node scripts/post-merge-release.mjs publish-npm --version "$VERSION" --sha "$RELEASE_SHA"
          echo "npm=vibepro@${VERSION} gitHead=${RELEASE_SHA}" >> "$GITHUB_STEP_SUMMARY"
          node scripts/post-merge-release.mjs release-body --event "$RUNNER_TEMP/post-merge-release-event.json" --output /tmp/vibepro-release.md
          node scripts/post-merge-release.mjs reconcile-github-release --version "$VERSION" --sha "$RELEASE_SHA" --notes-file /tmp/vibepro-release.md --repository "$GITHUB_REPOSITORY"
          echo "github_release=v${VERSION}@${RELEASE_SHA}" >> "$GITHUB_STEP_SUMMARY"

  docs:
    needs: [validation, release]
    # Docs follow a successful publication, or run alone when the version is unchanged.
    if: ${{ always() && needs.validation.result == 'success' && needs.validation.outputs.merged == 'true' && (needs.validation.outputs.release_required != 'true' || needs.release.result == 'success') }}
    runs-on: [self-hosted, Linux, X64, wsl-linux, nucbox-evo-x2]
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validation.outputs.merge_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Resolve merged pull request event
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.validation.outputs.pr_number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '{action: "closed", number: .number, pull_request: .}' > "$RUNNER_TEMP/post-merge-release-event.json"
      - name: Record version gate
        if: ${{ needs.validation.outputs.release_required != 'true' }}
        run: echo "npm=skipped (package version unchanged)" >> "$GITHUB_STEP_SUMMARY"
      - name: Project PR body into release history
        id: docs_projection
        run: |
          git checkout main
          git pull --ff-only origin main
      - name: Commit release history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pushed=false
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            npm ci --ignore-scripts
            node scripts/post-merge-release.mjs project --event "$RUNNER_TEMP/post-merge-release-event.json"
            git add CHANGELOG.md docs/releases docs/ja/releases docs/reference/version-history.md docs/ja/reference/version-history.md docs/guide/release-and-audit.md docs/ja/guide/release-and-audit.md docs/.vitepress/config.mjs
            if git diff --cached --quiet; then
              pushed=true
              echo "docs_commit=unchanged_or_reconciled" >> "$GITHUB_STEP_SUMMARY"
              break
            fi
            git commit -m "docs: record release notes for PR #${{ needs.validation.outputs.pr_number }}"
            if git push origin HEAD:main; then
              pushed=true
              echo "docs_commit=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
              break
            fi
            echo "docs_push_retry=${attempt}" >> "$GITHUB_STEP_SUMMARY"
          done
          test "$pushed" = true
      - name: Deploy VitePress manual
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          git pull --ff-only origin main
          npm ci
          npm run docs:deploy
          echo "docs_deploy=passed" >> "$GITHUB_STEP_SUMMARY"

  recovery:
    needs: [validation, release-candidate, release, docs]
    if: ${{ always() && needs.validation.result == 'success' && needs.validation.outputs.merged == 'true' }}
    runs-on: [self-hosted, Linux, X64, wsl-linux, nucbox-evo-x2]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validation.outputs.merge_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Record recovery state
        if: ${{ always() }}
        env:
          RESULTS: validation=${{ needs.validation.result }} release-candidate=${{ needs.release-candidate.result }} release=${{ needs.release.result }} docs=${{ needs.docs.result }}
        run: |
          if [ "${{ needs.validation.outputs.release_required }}" = "true" ] && [ -n "${{ needs.release.outputs.npm_published_at }}" ]; then
            WORKFLOW_COMPLETED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            node scripts/post-merge-release.mjs timing \
              --merged-at "${{ needs.validation.outputs.merged_at }}" \
              --publish-started-at "${{ needs.release.outputs.publish_started_at }}" \
              --npm-published-at "${{ needs.release.outputs.npm_published_at }}" \
              --workflow-completed-at "$WORKFLOW_COMPLETED_AT"
          else
            echo "release_timing=unavailable (npm publication was not observed)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "recovery=rerun this workflow; projection, GitHub Release, npm metadata, dist-tags, docs markers, and docs commit are reconciled idempotently" >> "$GITHUB_STEP_SUMMARY"
          echo "result=${RESULTS}" >> "$GITHUB_STEP_SUMMARY"
