name: CodeQL
run-name: CodeQL | pr=${{ github.event.pull_request.number || 0 }} | base=${{ github.event.pull_request.base.sha || github.event.before || 'none' }} | head=${{ github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
